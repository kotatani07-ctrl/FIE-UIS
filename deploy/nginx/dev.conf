limit_req_zone $binary_remote_addr zone=contact:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;

    server_tokens off;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location /api/v1/contact/ {
        limit_req zone=contact burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(health/|sitemap\.xml$|robots\.txt$|rss\.xml$|seo/|\.well-known/|files/) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Path admin rahasia; samakan dengan ADMIN_URL_PREFIX di .env.
    location /kelola-lokal/ {
        limit_req zone=admin_login burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Dokumen tidak boleh diakses langsung; unduhan lewat /files/download/<pk>/.
    location ~ ^/media/(research|announcements|downloads)/ {
        return 404;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        if ($uri !~ "^/$|^/(src|node_modules|@vite|@id|@fs|@react-refresh|asset|assets|favicon\.ico)(/|$)") {
            return 404;
        }
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
